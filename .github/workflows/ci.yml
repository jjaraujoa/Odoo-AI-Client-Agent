name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm 11 requiere Node >= 22.13: las dependencias se instalan con Node 22
      # y luego las pruebas corren con la versión de la matriz (Node 20 es el mínimo soportado).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: control-api/package.json

      - name: Setup Node.js 22 para instalar dependencias
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: control-api/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: control-api
        run: pnpm install --frozen-lockfile

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax verification
        working-directory: control-api
        run: |
          node --check src/server.js
          node --check bin/odoo-agent-cli.js
          node --check bin/odoo-mcp.js

      - name: Run test suite
        working-directory: control-api
        run: node --test --test-reporter=spec
